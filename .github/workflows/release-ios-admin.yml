name: Release iOS Admin (TestFlight)

# Builds the OneTap Admin iPhone app and uploads it to TestFlight, so every
# admin with TestFlight "Automatic Updates" on gets the new version.
# Trigger:
#   - Push `v*` (same tag as POS).
#   - Push `ios-admin-v*` for an Admin-only rebuild.
#   - Manual run from Actions → "Run workflow" (optionally with a build number).
#
# Required repository secrets (App Store Connect → Users and Access →
# Integrations → App Store Connect API, a key with the Admin role so Xcode
# can use Apple's cloud-managed distribution certificate):
#   ASC_KEY_ID      the key's ID, e.g. 2X9R4HXF34
#   ASC_ISSUER_ID   the Issuer ID shown above the keys list
#   ASC_KEY_P8      full contents of the downloaded AuthKey_<ID>.p8 file
#
# Build number: derived from the version (0.2.80 -> 2080) so it always grows
# with releases and never needs bumping in the Xcode project. A manual run can
# override it to re-upload the same version.
on:
  push:
    tags:
      - 'v*'
      - 'ios-admin-v*'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (leave empty to derive it from the version)'
        required: false
        default: ''

concurrency:
  group: release-ios-admin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testflight:
    name: Build and upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 CLI requires Node >= 22.
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Admin web bundle and sync iOS project
        run: pnpm cap:admin:sync

      - name: Write App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret $name (see the top of this workflow)"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Work out version and build number
        env:
          BUILD_OVERRIDE: ${{ github.event.inputs.build_number }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [[ -n "${BUILD_OVERRIDE:-}" ]]; then
            BUILD="$BUILD_OVERRIDE"
          else
            BUILD=$(node -e "const [a,b,c]=process.argv[1].split('.').map(Number); console.log(a*1000000+b*1000+c)" "$VERSION")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "OneTap Admin $VERSION ($BUILD)"

      # The archive is left unsigned; the export step signs it with Apple's
      # cloud-managed distribution certificate through the API key, so no
      # certificate or profile has to be stored in GitHub.
      - name: Archive
        working-directory: ios-admin/App
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OneTapAdmin.xcarchive" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -n 40

      - name: Sign and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>S683PTRW8G</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OneTapAdmin.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log" | tail -n 30
          grep -q 'EXPORT SUCCEEDED' "$RUNNER_TEMP/export.log"
          echo "::notice::Uploaded OneTap Admin $VERSION ($BUILD) to TestFlight. Apple processes it in 10-30 minutes."

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
