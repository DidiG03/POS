name: Release KDS

# Trigger:
#   - Push a tag like `kds-v0.1.0` to cut a release.
#   - Manual run from the Actions tab via "Run workflow" (handy for
#     publishing a draft build off the current branch without tagging).
on:
  push:
    tags:
      - 'kds-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Releases (channel: kds)'
        required: true
        default: 'true'

# Avoid concurrent runs for the same tag clobbering uploads to the
# release. New tag pushes cancel an in-flight build of the same tag.
concurrency:
  group: release-kds-${{ github.ref }}
  cancel-in-progress: true

# electron-builder uploads the .dmg/.exe/.AppImage + latest*.yml files
# to a GitHub Release. That needs write access on the repo's Releases.
permissions:
  contents: write

jobs:
  build:
    name: Build KDS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build native installers per platform. Cross-building is
          # possible but native always wins for signing/notarization.
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
          - os: windows-latest
            target: --win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version is read from `package.json#packageManager`.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build KDS bundle
        run: pnpm build:kds

      - name: Build + publish installer
        shell: bash
        env:
          # GitHub Releases auth — built-in token has write permissions
          # for the repo it runs in (DidiG03/POS).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Code-signing secrets are read inside the step so that
          # MISSING secrets stay UNSET rather than being injected as
          # empty strings. electron-builder treats `CSC_LINK=""` as a
          # relative path and resolves it to the project root, which
          # fails with `…/POS not a file`. Apple env vars only kick in
          # when MAC_CSC_LINK is present.
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK_SECRET: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_SECRET: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          CONFIG="${GITHUB_WORKSPACE}/electron-builder.kds.yml"
          if [[ ! -f "$CONFIG" ]]; then
            echo "::error::Missing electron-builder config: $CONFIG"
            exit 1
          fi
          if [[ ! -f dist/kds/main/index.js ]]; then
            echo "::error::Missing KDS main bundle (run build:kds first): dist/kds/main/index.js"
            exit 1
          fi
          # Only export signing env vars when the secret actually has
          # a value. An empty string here is worse than unset because
          # electron-builder will try to use "" as a cert path.
          if [[ -n "${MAC_CSC_LINK:-}" ]]; then
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="${MAC_CSC_KEY_PASSWORD:-}"
            echo "macOS code signing: enabled"
          else
            unset CSC_LINK CSC_KEY_PASSWORD || true
            # Force-disable Apple notarization too — APPLE_ID being set
            # alone (without a cert) causes electron-builder to abort.
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID || true
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "macOS code signing: disabled (no MAC_CSC_LINK secret) — building unsigned .dmg"
          fi
          if [[ -n "${WIN_CSC_LINK_SECRET:-}" ]]; then
            export WIN_CSC_LINK="$WIN_CSC_LINK_SECRET"
            export WIN_CSC_KEY_PASSWORD="${WIN_CSC_KEY_PASSWORD_SECRET:-}"
            echo "Windows code signing: enabled"
          else
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD || true
            echo "Windows code signing: disabled (no WIN_CSC_LINK secret)"
          fi
          # Manual runs can skip publishing; tag pushes always publish.
          PUBLISH="always"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && \
             [[ "${{ github.event.inputs.publish }}" == "false" ]]; then
            PUBLISH="never"
          fi
          # `--` ensures pnpm forwards every flag to electron-builder.
          # Without it, macOS runners sometimes swallow `--config` and
          # electron-builder treats the project dir as a config path →
          # "…/POS/POS not a file".
          pnpm exec -- electron-builder \
            --config "$CONFIG" \
            ${{ matrix.target }} \
            --publish "$PUBLISH"

      - name: Upload installers as workflow artifact
        # Mirror the published files to the workflow run too, so you
        # can grab them from Actions even if the GitHub Release upload
        # failed (e.g. permissions).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kds-${{ matrix.os }}
          path: |
            dist-installers/kds/**/*.dmg
            dist-installers/kds/**/*.exe
            dist-installers/kds/**/*.AppImage
            dist-installers/kds/**/*.zip
            dist-installers/kds/**/latest*.yml
          if-no-files-found: warn
          retention-days: 14
