name: Release Admin

# Trigger:
#   - Push `v*` (same tag as POS) so Admin Mac Intel/ARM land on that release.
#   - Push `admin-v*` for an Admin-only rebuild.
#   - Manual run from Actions → "Run workflow".
on:
  push:
    tags:
      - 'v*'
      - 'admin-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Releases (channel: admin)'
        required: true
        default: 'true'

concurrency:
  group: release-admin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Admin (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon; macos-15-intel is x86_64.
          # Windows Admin is also published by release-windows-client.yml.
          - os: macos-latest
            target: --mac --arm64
            label: mac-arm64
          - os: macos-15-intel
            target: --mac --x64
            label: mac-x64
          - os: windows-latest
            target: --win
            label: win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Typecheck (full tree)
        run: pnpm typecheck

      - name: Build Admin bundle
        run: pnpm build:admin

      - name: Build installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK_SECRET: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_SECRET: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          CONFIG="${GITHUB_WORKSPACE}/electron-builder.admin.yml"
          if [[ ! -f "$CONFIG" ]]; then
            echo "::error::Missing electron-builder config: $CONFIG"
            exit 1
          fi
          if [[ ! -f dist/admin/main/index.js ]]; then
            echo "::error::Missing Admin main bundle (run build:admin first): dist/admin/main/index.js"
            exit 1
          fi
          if [[ -n "${MAC_CSC_LINK:-}" ]]; then
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="${MAC_CSC_KEY_PASSWORD:-}"
            echo "macOS code signing: enabled"
          else
            unset CSC_LINK CSC_KEY_PASSWORD || true
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID || true
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "macOS code signing: disabled (no MAC_CSC_LINK secret)"
          fi
          if [[ -n "${WIN_CSC_LINK_SECRET:-}" ]]; then
            export WIN_CSC_LINK="$WIN_CSC_LINK_SECRET"
            export WIN_CSC_KEY_PASSWORD="${WIN_CSC_KEY_PASSWORD_SECRET:-}"
            echo "Windows code signing: enabled"
          else
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD || true
            echo "Windows code signing: disabled (no WIN_CSC_LINK secret)"
          fi
          pnpm exec -- electron-builder \
            --config "$CONFIG" \
            ${{ matrix.target }} \
            --publish never

      - name: Upload installers as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-${{ matrix.label }}
          path: |
            dist-installers/admin/**/*.dmg
            dist-installers/admin/**/*.exe
            dist-installers/admin/**/*.zip
            dist-installers/admin/**/*.blockmap
            dist-installers/admin/**/*.yml
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.publish != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: admin-*
          path: artifacts

      - name: Publish installers to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          TITLE="${TAG#v}"

          mkdir -p dist
          find artifacts -type f \( \
            -name '*.dmg' -o -name '*.blockmap' \
            -o -name '*.zip' -o -name '*.exe' -o -name '*.yml' \
          \) -exec cp -v {} dist/ \;

          ARM_DMG=$(ls dist/*-arm64.dmg 2>/dev/null | head -1 || true)
          INTEL_DMG=$(ls dist/*-x64.dmg 2>/dev/null | head -1 || true)
          ARM_ZIP=$(ls dist/*-arm64.zip 2>/dev/null | head -1 || true)
          INTEL_ZIP=$(ls dist/*-x64.zip 2>/dev/null | head -1 || true)
          if [[ ! -f "${ARM_DMG:-}" ]]; then
            echo "::error::Missing macOS Apple Silicon installer (*-arm64.dmg)"
            ls -la dist artifacts/* 2>/dev/null || true
            exit 1
          fi
          if [[ ! -f "${INTEL_DMG:-}" ]]; then
            echo "::error::Missing macOS Intel installer (*-x64.dmg)"
            ls -la dist artifacts/* 2>/dev/null || true
            exit 1
          fi
          if [[ ! -f "${ARM_ZIP:-}" ]]; then
            echo "::error::Missing macOS Apple Silicon update zip (*-arm64.zip)"
            ls -la dist artifacts/* 2>/dev/null || true
            exit 1
          fi
          if [[ ! -f "${INTEL_ZIP:-}" ]]; then
            echo "::error::Missing macOS Intel update zip (*-x64.zip)"
            ls -la dist artifacts/* 2>/dev/null || true
            exit 1
          fi

          node scripts/writeMacUpdateYml.mjs \
            "$VERSION" dist/admin-mac.yml \
            "$ARM_ZIP" "$INTEL_ZIP" "$ARM_DMG" "$INTEL_DMG"

          # Do not clobber POS updater feeds (latest.yml / latest-mac.yml).
          rm -f dist/latest.yml dist/latest-mac.yml dist/latest-linux.yml \
            dist/kds.yml dist/kds-mac.yml dist/latest-kds.yml || true

          source "${GITHUB_WORKSPACE}/.github/scripts/gh-release.sh"
          gh_ensure_release "$TAG" "$TITLE" \
            "OneTap Admin ${VERSION} (macOS Intel/ARM)."

          UPLOAD=()
          shopt -s nullglob
          # Windows Admin .exe + admin.yml are published by
          # release-windows-client.yml. Uploading them here races and 404s.
          UPLOAD+=(
            dist/OneTap-Admin*.dmg
            dist/OneTap-Admin*.zip
            dist/OneTap-Admin*.blockmap
            dist/admin-mac.yml
          )
          shopt -u nullglob
          if [[ ${#UPLOAD[@]} -eq 0 ]]; then
            echo "::error::No installer files found to upload"
            exit 1
          fi

          gh_upload_with_retry "$TAG" "${UPLOAD[@]}"
          echo "Published Admin to https://github.com/${{ github.repository }}/releases/tag/${TAG}"
