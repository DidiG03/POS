name: Release POS

# Trigger:
#   - Push a version tag like `v0.2.0` to publish POS installers.
#   - Manual run from Actions → "Run workflow" (optional publish=false for a dry run).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Releases (POS channel: latest)'
        required: true
        default: 'true'

concurrency:
  group: release-pos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build POS (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners so Prisma + serialport match the installer arch.
          # macos-latest is Apple Silicon; macos-15-intel is the Intel image
          # (available until August 2027). Windows POS + KDS + Admin are published by
          # release-windows-client.yml onto the same tag.
          - os: macos-latest
            target: --mac --arm64
            label: mac-arm64
          - os: macos-15-intel
            target: --mac --x64
            label: mac-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Typecheck (full tree)
        run: pnpm typecheck

      - name: Prepare Prisma runtime files for Electron packaging
        run: pnpm prisma:prepare-electron

      - name: Build empty migrated seed DB
        run: pnpm db:seedfile

      - name: Rebuild native modules for Electron (serialport)
        run: pnpm serial:rebuild

      - name: Build renderer/main bundles
        run: pnpm build

      - name: Build installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK_SECRET: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_SECRET: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${MAC_CSC_LINK:-}" ]]; then
            export CSC_LINK="$MAC_CSC_LINK"
            export CSC_KEY_PASSWORD="${MAC_CSC_KEY_PASSWORD:-}"
            echo "macOS code signing: enabled"
          else
            unset CSC_LINK CSC_KEY_PASSWORD || true
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID || true
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "macOS code signing: disabled (no MAC_CSC_LINK secret)"
          fi
          if [[ -n "${WIN_CSC_LINK_SECRET:-}" ]]; then
            export WIN_CSC_LINK="$WIN_CSC_LINK_SECRET"
            export WIN_CSC_KEY_PASSWORD="${WIN_CSC_KEY_PASSWORD_SECRET:-}"
            echo "Windows code signing: enabled"
          else
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD || true
            echo "Windows code signing: disabled (no WIN_CSC_LINK secret)"
          fi
          # Upload via the publish job (gh release upload) so Silicon + Intel
          # land on the same published release. electron-builder --publish
          # drafts were racing the Windows workflow and dropping Mac assets.
          pnpm exec -- electron-builder \
            ${{ matrix.target }} \
            --publish never

      - name: Upload installers as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: >-
      github.event_name == 'push' ||
      github.event.inputs.publish != 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pos-*
          path: artifacts

      - name: Publish installers to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi
          TITLE="${TAG#v}"

          mkdir -p dist
          find artifacts -type f \( \
            -name '*.dmg' -o -name '*.blockmap' \
            -o -name '*.zip' -o -name 'latest*.yml' \
          \) -exec cp -v {} dist/ \;

          ARM_DMG=$(ls dist/*-arm64.dmg 2>/dev/null | head -1 || true)
          INTEL_DMG=$(ls dist/*-x64.dmg 2>/dev/null | head -1 || true)
          ARM_ZIP=$(ls dist/*-arm64.zip 2>/dev/null | head -1 || true)
          INTEL_ZIP=$(ls dist/*-x64.zip 2>/dev/null | head -1 || true)
          if [[ ! -f "${ARM_DMG:-}" ]]; then
            echo "::error::Missing macOS Apple Silicon installer (*-arm64.dmg)"
            ls -la dist artifacts/* 2>/dev/null || true
            exit 1
          fi
          if [[ ! -f "${INTEL_DMG:-}" ]]; then
            echo "::error::Missing macOS Intel installer (*-x64.dmg)"
            ls -la dist artifacts/* 2>/dev/null || true
            exit 1
          fi
          # electron-updater on macOS will not install from a .dmg ("ZIP file
          # not provided"). Both arch zips must be in latest-mac.yml.
          if [[ ! -f "${ARM_ZIP:-}" ]]; then
            echo "::error::Missing macOS Apple Silicon update zip (*-arm64.zip)"
            ls -la dist artifacts/* 2>/dev/null || true
            exit 1
          fi
          if [[ ! -f "${INTEL_ZIP:-}" ]]; then
            echo "::error::Missing macOS Intel update zip (*-x64.zip)"
            ls -la dist artifacts/* 2>/dev/null || true
            exit 1
          fi

          node scripts/writeMacUpdateYml.mjs \
            "$VERSION" dist/latest-mac.yml \
            "$ARM_ZIP" "$INTEL_ZIP" "$ARM_DMG" "$INTEL_DMG"

          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          {
            echo "## OneTap POS ${VERSION}"
            echo
            echo "### Downloads"
            echo
            echo "**POS**"
            echo "- macOS Apple Silicon: \`OneTap-POS-${VERSION}-arm64.dmg\`"
            echo "- macOS Intel: \`OneTap-POS-${VERSION}-x64.dmg\`"
            echo "- Windows: \`OneTap-POS-Setup-${VERSION}.exe\`"
            echo
            echo "**Admin**"
            echo "- macOS Apple Silicon: \`OneTap-Admin-${VERSION}-arm64.dmg\`"
            echo "- macOS Intel: \`OneTap-Admin-${VERSION}-x64.dmg\`"
            echo "- Windows: \`OneTap-Admin-Setup-${VERSION}.exe\`"
            echo
            echo "**KDS**"
            echo "- macOS Apple Silicon: \`OneTap-KDS-${VERSION}-arm64.dmg\`"
            echo "- macOS Intel: \`OneTap-KDS-${VERSION}-x64.dmg\`"
            echo "- Windows: \`OneTap-KDS-Setup-${VERSION}.exe\`"
            echo
            echo "Windows POS, KDS, and Admin installers are published onto this same tag."
            echo
            echo "### Changes in v0.2.92 (full bug scan: 39 fixes)"
            echo "- Disk protection: a power cut during first-time encryption or a normal start can no longer lose the key to the sales ledger. A failed repair puts the original ledger back, and a backup restore stops if the current data cannot be backed up first."
            echo "- Settings: if Admin settings fail to load, nothing is saved, so a weak connection can no longer switch the currency, turn fiscalization off, disconnect phones or delete table areas. The floor plan editor works the same way."
            echo "- Money: reports and shift slips show VAT on the amount actually charged after discounts and service charge, matching the fiscal invoice. Payment lines with a negative price are removed. Euro totals on the pay screen match the receipt to the cent."
            echo "- Number entry: a decimal comma works for weights (0,35 kg) and menu prices (1,50). It used to give 35 kg or 150. VAT can be typed as 20 for 20%."
            echo "- Tables: a bill loading late can no longer land in another table's cart after switching tables, a transfer or a void. Items a colleague requests keep their note, kitchen station and exact weight."
            echo "- Kitchen: drinks and food get separate cards, voiding an empty table no longer marks the previous party's dishes voided, Recall skips voided cards, and done cards show the waiter who sent them."
            echo "- Printing: one failing printer no longer loses the slips for the other printers."
            echo "- Staff: double clock-ins no longer create two shifts. Only a manager can force a clock-out. The last admin cannot be disabled or demoted. Logging out, or a refused login, now also signs the window out on the till."
            echo "- Reservations: the day arrows work on the days the clocks change, a late-seated party is respected when booking, a booking needs a time, and a failed refresh no longer shows reserved tables as free."
            echo "- Reports: Last month in Review is correct on the 29th to 31st, and the sales chart no longer skips a day at the spring clock change."
            echo "- Updates and phones: a downloaded update stays ready after the next check, install problems are shown, Dismiss all on unsent work asks first, and phones no longer save a reservation, staff member or menu item twice on bad Wi-Fi."
            echo "- Licence: a single failed licence check no longer locks a paid-up till."
          } > "$NOTES_FILE"

          source "${GITHUB_WORKSPACE}/.github/scripts/gh-release.sh"
          gh_ensure_release "$TAG" "$TITLE" "$NOTES_FILE"

          UPLOAD=()
          shopt -s nullglob
          UPLOAD+=( dist/*.dmg dist/*.blockmap dist/*.zip dist/latest*.yml )
          shopt -u nullglob
          if [[ ${#UPLOAD[@]} -eq 0 ]]; then
            echo "::error::No installer files found to upload"
            exit 1
          fi

          # Upload first, then edit notes / latest. Editing a release while a
          # sibling workflow is uploading invalidates GitHub's upload URL (404).
          gh_upload_with_retry "$TAG" "${UPLOAD[@]}"
          gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES_FILE" --draft=false --latest

          echo "Published to https://github.com/${{ github.repository }}/releases/tag/${TAG}"
