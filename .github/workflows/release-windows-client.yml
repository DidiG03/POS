name: Release Windows Client

# Builds POS + KDS Windows installers and uploads them to GitHub Releases
# (the public download page), not workflow artifacts.
#
# Trigger:
#   - Push tag `v0.2.0` (or any v* tag matching package.json version)
#   - Manual run from Actions → "Run workflow"
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0). Defaults to v{package.json version}.'
        required: false
        default: ''

concurrency:
  group: release-windows-client
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release-windows:
    name: Build + publish Windows installers
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Typecheck (full tree)
        run: pnpm typecheck

      - name: Prepare Prisma runtime files for Electron packaging
        run: pnpm prisma:prepare-electron

      - name: Build seeded SQLite DB
        run: pnpm db:seedfile

      - name: Rebuild native modules for Electron (serialport)
        run: pnpm serial:rebuild

      - name: Build POS bundle + Windows installer
        run: |
          pnpm build
          pnpm exec electron-builder --win nsis --publish never

      - name: Build KDS bundle + Windows installer
        run: |
          pnpm build:kds
          pnpm exec electron-builder --config electron-builder.kds.yml --win nsis --publish never

      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="${INPUT_TAG:-v${VERSION}}"
          TITLE="${TAG#v}"

          POS_EXE=$(ls dist/*Setup*.exe dist/*.exe 2>/dev/null | head -1)
          KDS_EXE=$(ls dist-installers/kds/*Setup*.exe dist-installers/kds/*.exe 2>/dev/null | head -1)
          if [[ ! -f "$POS_EXE" ]]; then
            echo "::error::Missing POS installer in dist/"
            exit 1
          fi
          if [[ ! -f "$KDS_EXE" ]]; then
            echo "::error::Missing KDS installer in dist-installers/kds/"
            exit 1
          fi

          # electron-builder names installers from productName (OneTap POS /
          # OneTap KDS). latest.yml must use those exact filenames or in-app
          # updates 404. Also keep Code-Orbit aliases for older clients.
          CANONICAL_POS_NAME="OneTap-POS-Setup-${VERSION}.exe"
          CANONICAL_KDS_NAME="OneTap-KDS-Setup-${VERSION}.exe"
          LEGACY_POS_NAME="Code-Orbit-POS-Setup-${VERSION}.exe"
          LEGACY_KDS_NAME="Code-Orbit-KDS-Setup-${VERSION}.exe"
          CANONICAL_POS="dist/${CANONICAL_POS_NAME}"
          CANONICAL_KDS="dist-installers/kds/${CANONICAL_KDS_NAME}"
          LEGACY_POS="dist/${LEGACY_POS_NAME}"
          LEGACY_KDS="dist-installers/kds/${LEGACY_KDS_NAME}"
          cp "$POS_EXE" "$CANONICAL_POS"
          cp "$KDS_EXE" "$CANONICAL_KDS"
          cp "$POS_EXE" "$LEGACY_POS"
          cp "$KDS_EXE" "$LEGACY_KDS"

          # electron-builder emits `latest.yml` for POS but not `latest-kds.yml`
          # when building with `--publish never` and a custom KDS channel.
          write_update_yml() {
            local exe_path="$1"
            local yml_path="$2"
            local artifact_name="$3"
            node -e "
              const fs = require('fs');
              const crypto = require('crypto');
              const exePath = process.argv[1];
              const ymlPath = process.argv[2];
              const version = process.argv[3];
              const artifactName = process.argv[4];
              const data = fs.readFileSync(exePath);
              const sha512 = crypto.createHash('sha512').update(data).digest('base64');
              const yml = [
                'version: ' + version,
                'files:',
                '  - url: ' + artifactName,
                '    sha512: ' + sha512,
                '    size: ' + data.length,
                'path: ' + artifactName,
                'sha512: ' + sha512,
                \"releaseDate: '\" + new Date().toISOString() + \"'\",
                '',
              ].join('\\n');
              fs.writeFileSync(ymlPath, yml);
            " "$exe_path" "$yml_path" "$VERSION" "$artifact_name"
          }

          # Always rewrite latest.yml so it matches the OneTap filename the
          # current app downloads. Stale electron-builder names caused 404s
          # after the rebrand.
          write_update_yml "$CANONICAL_POS" dist/latest.yml "$CANONICAL_POS_NAME"
          # The KDS app runs setupAutoUpdater({ channel: 'kds' }), so on Windows
          # electron-updater fetches a manifest named `kds.yml` (NOT
          # `latest-kds.yml`). Publish under that exact name or the KDS silently
          # reports "no update". We also publish `latest-kds.yml` for backward
          # compatibility with any older naming expectations.
          write_update_yml "$CANONICAL_KDS" dist-installers/kds/kds.yml "$CANONICAL_KDS_NAME"
          cp dist-installers/kds/kds.yml dist-installers/kds/latest-kds.yml

          NOTES="Windows client installers for OneTap POS ${VERSION} and OneTap KDS ${VERSION}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG"
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES"
          fi

          UPLOAD=( "$CANONICAL_POS" "$CANONICAL_KDS" "$LEGACY_POS" "$LEGACY_KDS" )
          shopt -s nullglob
          UPLOAD+=( dist/latest*.yml dist-installers/kds/kds.yml dist-installers/kds/latest*.yml )
          shopt -u nullglob

          gh release upload "$TAG" "${UPLOAD[@]}" --clobber

          gh release edit "$TAG" --draft=false --latest

          echo "Published to https://github.com/${{ github.repository }}/releases/tag/${TAG}"
