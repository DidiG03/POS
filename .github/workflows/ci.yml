name: CI

# Run on push and pull requests
on:
  push:
    branches: [main, master, develop]
    # A release tag is checked against package.json here too, so a
    # mismatched tag shows red in CI as well as in every release workflow.
    tags: ['v*']
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # package.json, Android and iOS must carry one version, and a pushed
      # tag must be v<that version> (`scripts/checkReleaseVersion.mjs`).
      - name: Check release version
        run: node scripts/checkReleaseVersion.mjs
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version will be read from package.json packageManager field
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Generate Prisma Client
        run: pnpm db:generate
      
      - name: Typecheck (full tree)
        run: pnpm typecheck
      
      - name: Run linter
        run: pnpm lint

      # Packages that ship to customers: a critical advisory fails the
      # build; high ones are listed so they are seen, without blocking.
      - name: Check shipped dependencies for critical advisories
        run: pnpm audit --prod --audit-level=critical

      - name: List high advisories in shipped dependencies
        run: pnpm audit --prod --audit-level=high || true

      - name: Check the billing server's dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=critical
      
      - name: Run unit tests
        run: pnpm test
      
      - name: Build application
        run: pnpm build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7
